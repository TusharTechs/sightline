<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sightline">
  <title>Sightline</title>
  <!-- A line of sight that becomes sound. Explicit colour rather than
       currentColor: GitHub renders README images in an <img>, where
       currentColor resolves to black and disappears in dark mode. -->
  <g fill="none" stroke="#f2f5f8" stroke-width="4.5" stroke-linecap="round">
    <line x1="6" y1="32" x2="26" y2="32"/>
    <path d="M32 20a16 16 0 0 1 0 24"/>
    <path d="M40 14a26 26 0 0 1 0 36" opacity=".62"/>
    <path d="M48 8a36 36 0 0 1 0 48" opacity=".32"/>
  </g>
</svg>
