<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Sightline mark: a line of sight becoming sound">
  <title>Sightline</title>
  <!-- A line of sight that becomes sound. The horizontal run is the looking;
       the arcs are what it turns into. Reads at 16px and in one colour. -->
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
    <line x1="6" y1="32" x2="26" y2="32"/>
    <path d="M32 20a16 16 0 0 1 0 24"/>
    <path d="M40 14a26 26 0 0 1 0 36" opacity=".62"/>
    <path d="M48 8a36 36 0 0 1 0 48" opacity=".32"/>
  </g>
</svg>
