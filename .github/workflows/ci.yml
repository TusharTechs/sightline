name: tests

# Runs on every push and pull request. Nothing here needs AWS credentials, a
# Fire TV, or a network call: the pipeline tests exercise pure functions with
# synthetic audio and fixture bundles, so the suite is the same on a laptop
# and on a runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: pipeline (python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The project claims to run on all three. This is where that is checked
        # rather than asserted.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --quiet pytest numpy pydantic pillow
      - name: pipeline tests
        run: python -m pytest pipeline/tests -q

  quality-harness:
    name: audio-description-qa checks run against a fixture bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest numpy pydantic pillow
      - name: preflight rejects a bundle with camera language
        run: |
          python - <<'PY'
          import json, os, sys, tempfile
          sys.path.insert(0, "pipeline/src")
          import preflight
          d = tempfile.mkdtemp()
          json.dump({"media": "content.mp4", "cues": [
              {"t": 10.0, "rank": 1, "text": "The camera pans across the room",
               "pcm": "desc-01.pcm", "duration": 2.0}]},
              open(os.path.join(d, "timeline.json"), "w"))
          open(os.path.join(d, "desc-01.pcm"), "wb").write(b"\0" * 32)
          fails, _ = preflight.check(d)
          assert any("camera language" in f for f in fails), "preflight missed it"
          print("preflight caught the camera language:", fails[0])
          PY

  app:
    name: Vega app unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: jest
        working-directory: app
        run: npm test -- --ci
